name: rename-to-dyna-bound
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rename-to-dyna-bound.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename repository to Dyna-Bound
        env:
          GH_TOKEN: ${{ secrets.RENAME_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RENAME_TOKEN missing; trying GITHUB_TOKEN"
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          gh api -X PATCH "repos/${{ github.repository }}" -f name='Dyna-Bound'
          gh api "repos/${{ github.repository_owner }}/Dyna-Bound" --jq .full_name
